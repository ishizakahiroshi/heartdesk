# Tag-driven GitHub Release, source only.
# heartdesk has no prebuilt binaries: the server will not start without a vendorSecret that the
# operator injects at build time (README, "Build"), so a shared binary would be useless.
# Channels for v0.1.0: github-release only (no npm / PyPI / crates / homebrew / winget).
# GITHUB_TOKEN is enough for this repo's Release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release (source only)
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release target
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid release tag: ${RELEASE_TAG}"
            exit 1
          fi
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          source_commit="$(git rev-parse HEAD)"
          if [ "${source_commit}" != "${tag_commit}" ]; then
            echo "::error::checked out source ${source_commit} does not match ${RELEASE_TAG} (${tag_commit})"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and test the tagged source
        shell: bash
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test ./...

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          extract() {
            awk -v ver="$1" '
              BEGIN { hdr = "## [" ver "]" }
              index($0, hdr) == 1 { flag = 1; next }
              flag && index($0, "## [") == 1 { exit }
              flag { print }
            ' CHANGELOG.md
          }
          extract "$VERSION" > "${RUNNER_TEMP}/release-notes.md"
          # A release candidate such as v0.1.0-rc.1 uses the section of the version it prepares.
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ] && [[ "$VERSION" == *-* ]]; then
            extract "${VERSION%%-*}" > "${RUNNER_TEMP}/release-notes.md"
          fi
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          echo "----- release notes (${VERSION}) -----"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          flags=()
          # 0.x and any tag with a suffix is a pre-release.
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag \
            "${flags[@]}"
