# Go CI. Template: github-actions assets/ci-go.yml.
# web/ is go:embed of static HTML/JS/CSS, not a frontend build — no frontend job.
# 2026-10-21: This is a private repo, so commits made locally are checked locally. On GitHub this runs only for PRs from the external AI (bot account ishizakahiroshi-bot) and for manual runs.
# It no longer starts on push (it does not run for pushes from the local machine or for merging a PR).
name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-check:
    name: Go (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'ishizakahiroshi-bot'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify modules
        run: go mod verify

  go-mod-tidy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'ishizakahiroshi-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go mod tidy
        run: go mod tidy
      - name: Verify tidy output
        run: git diff --exit-code -- go.mod go.sum

  govulncheck:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'ishizakahiroshi-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  claude-md:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'ishizakahiroshi-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check CLAUDE.md stays an index
        run: node scripts/check-claude-md.mjs
