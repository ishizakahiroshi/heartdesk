<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- Connection lines (bridge) -->
  <g stroke="white" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="17" y2="17"/>
    <line x1="32" y1="32" x2="47" y2="17"/>
    <line x1="32" y1="32" x2="17" y2="47"/>
    <line x1="32" y1="32" x2="47" y2="47"/>
  </g>
  <!-- Outer nodes (managed servers) -->
  <g fill="white">
    <circle cx="16" cy="16" r="5"/>
    <circle cx="48" cy="16" r="5"/>
    <circle cx="16" cy="48" r="5"/>
    <circle cx="48" cy="48" r="5"/>
  </g>
  <!-- Central hub (admin / management core) -->
  <circle cx="32" cy="32" r="9" fill="white"/>
  <circle cx="32" cy="32" r="4" fill="#0F172A"/>
</svg>
