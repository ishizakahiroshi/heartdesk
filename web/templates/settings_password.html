{{define "settings_password"}}<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワード変更</title>
<link rel="stylesheet" href="{{.StaticBase}}/css/shared.css?v={{.AssetVersion}}">
<style>
body { margin: 0; background: #0f1117; color: #e6edf3; }
.wrap { max-width: 760px; margin: 24px auto; padding: 0 16px; }
.card { background: #151a23; border: 1px solid #293142; border-radius: 12px; padding: 18px; }
h1 { font-size: 1.2rem; margin: 0 0 14px; }
label { display: block; margin: 10px 0 6px; color: #9eb0d4; font-size: 0.86rem; }
input[type="password"] { width: 100%; height: 38px; border-radius: 8px; border: 1px solid #33425d; background: #0e1420; color: #e6edf3; padding: 0 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
button, .link-btn { border: none; border-radius: 8px; height: 36px; padding: 0 14px; background: #2b82ff; color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.link-btn { background: #3b4556; }
.msg { margin-bottom: 10px; padding: 8px 10px; border-radius: 7px; font-size: 0.88rem; }
.msg.ok { background: #173521; border: 1px solid #2f8f4e; color: #a8edbc; }
.msg.err { background: #3a1f26; border: 1px solid #8f3e4a; color: #ffbdc8; }
.nav { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
	<div class="nav">
		<a class="link-btn" href="{{.BackURL}}">Monitorへ戻る</a>
		<a class="link-btn" href="{{.Settings2FAPath}}">2FA設定</a>
	</div>
	<div class="card">
		<h1>パスワード変更（{{.CurrentUser}}）</h1>
		{{if .Message}}<div class="msg ok">{{.Message}}</div>{{end}}
		{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
		<form method="post" action="{{.Path}}">
			<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
			<label for="current_password">現在のパスワード</label>
			<input id="current_password" type="password" name="current_password" required>
			<label for="new_password">新しいパスワード（8文字以上）</label>
			<input id="new_password" type="password" name="new_password" required>
			<label for="confirm_password">新しいパスワード（確認）</label>
			<input id="confirm_password" type="password" name="confirm_password" required>
			<div class="row">
				<button type="submit">更新する</button>
			</div>
		</form>
	</div>
</div>
</body>
</html>{{end}}
